<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://translate.googleapis.com; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Treppenwitz · Learn German</title>
<meta name="description"
  content="Treppenwitz — learn German one word at a time. Vocabulary and sentence practice with spaced repetition, offline in your browser.">
<meta name="theme-color" content="#0f6b68">
<link rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230f6b68'/%3E%3Cpath d='M10 38 H18 V30 H26 V22 H34 V14 H38' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='38' cy='14' r='3' fill='%23f0c85a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>

<body>
  <a href="#main" class="skip btn btn-neutral">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none">
          <path d="M8 40 H17 V31 H26 V22 H35 V13 H40" stroke="currentColor" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="40" cy="13" r="3" fill="#f0c85a"/>
        </svg>
      </span>
      <div>
        <div class="brand-title">Treppenwitz</div>
        <div class="brand-sub">Learn German one word at a time</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle light and dark theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Open settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.66.73.87H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div id="app"></div>
  </main>

  <div id="band" class="hidden" role="region" aria-label="Answer feedback"></div>
  <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <nav id="nav" aria-label="Main">
    <button type="button" data-nav="path" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4v-4h4v-4h4V8h4"/></svg>
      Path
    </button>
    <button type="button" data-nav="review">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Review
    </button>
    <button type="button" data-nav="grammar" id="navGrammar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Grammar
    </button>
    <button type="button" data-nav="stats">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 21V10M9 21V4M15 21v-8M21 21V7"/></svg>
      Stats
    </button>
  </nav>

  <noscript><p>Treppenwitz needs JavaScript.</p></noscript>
  <!-- defer keeps execution order: rules → words → main -->
  <script src="rules.js" defer></script>
  <script src="words.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
